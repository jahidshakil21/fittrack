<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FITTRACK — Personal Fitness Tracker</title>
  <meta name="description" content="Personal mobile-first fitness tracker PWA for workouts, body weight, calories, water, and healthy habits." />
  <meta name="theme-color" content="#090a0c" />

  <!-- iOS Safari PWA Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FITTRACK" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />

  <link rel="icon" type="image/png" href="./assets/icons/favicon.png" />
  <link rel="manifest" href="./manifest.json" />

  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div>
          <span class="brand-title">FITTRACK</span>
          <span id="header-view-title" class="header-subtitle">Dashboard</span>
        </div>
      </div>

      <div class="header-actions">
        <span id="offline-pill" class="offline-pill" role="status" aria-live="polite">Offline</span>
        <button class="icon-btn" type="button" data-nav="timer" aria-label="Open Rest Timer" title="Rest Timer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13" r="8"></circle>
            <path d="M12 9v4l2 2"></path>
            <path d="M5 3 2 6"></path>
            <path d="m22 6-3-3"></path>
          </svg>
        </button>
        <button class="icon-btn" type="button" data-nav="profile" aria-label="Open Profile" title="Profile">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>
      </div>
    </header>

    <main id="app-main" class="app-main" tabindex="-1"></main>

    <!-- Primary Bottom Tab Bar -->
    <nav class="bottom-nav" aria-label="Primary Navigation">
      <button class="nav-tab active" type="button" data-nav="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9" rx="1"></rect>
          <rect x="14" y="3" width="7" height="5" rx="1"></rect>
          <rect x="14" y="12" width="7" height="9" rx="1"></rect>
          <rect x="3" y="16" width="7" height="5" rx="1"></rect>
        </svg>
        <span>Home</span>
      </button>
      <button class="nav-tab" type="button" data-nav="workouts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6.5 6.5 11 11"></path>
          <path d="m21 21-1-1"></path>
          <path d="m3 3 1 1"></path>
          <path d="m18 22 4-4"></path>
          <path d="m2 6 4-4"></path>
          <path d="m3 10 7-7"></path>
          <path d="m14 21 7-7"></path>
        </svg>
        <span>Workouts</span>
      </button>
      <button class="nav-tab" type="button" data-nav="nutrition">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a4 4 0 0 0-4 4v2h8V6a4 4 0 0 0-4-4Z"></path>
          <path d="M4 10h16v2a8 8 0 0 1-16 0v-2Z"></path>
          <path d="M12 20v2"></path>
        </svg>
        <span>Nutrition</span>
      </button>
      <button class="nav-tab" type="button" data-nav="water">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
        </svg>
        <span>Water</span>
      </button>
      <button class="nav-tab" type="button" id="more-menu-btn" aria-expanded="false" aria-controls="more-sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1"></circle>
          <circle cx="19" cy="12" r="1"></circle>
          <circle cx="5" cy="12" r="1"></circle>
        </svg>
        <span>More</span>
      </button>
    </nav>
  </div>

  <!-- More Navigation Sheet -->
  <div id="more-sheet" class="sheet-backdrop" role="dialog" aria-modal="true" aria-label="All Sections">
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="row-between" style="margin-bottom: 12px;">
        <h2>All Sections</h2>
        <button type="button" class="btn btn-ghost btn-sm" id="close-more-sheet">Close</button>
      </div>
      <div class="sheet-grid">
        <button class="sheet-item" type="button" data-nav="weight">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12l2 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9l2-5z"/><path d="M12 10v4"/><path d="M10 12h4"/></svg>
          <span>Weight Tracker</span>
        </button>
        <button class="sheet-item" type="button" data-nav="exercises">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
          <span>Exercise Library</span>
        </button>
        <button class="sheet-item" type="button" data-nav="plans">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
          <span>Workout Plans</span>
        </button>
        <button class="sheet-item" type="button" data-nav="timer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg>
          <span>Rest Timer</span>
        </button>
        <button class="sheet-item" type="button" data-nav="profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Profile &amp; Goals</span>
        </button>
        <button class="sheet-item" type="button" data-nav="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 0 1 0 4h-.09c-.66 0-1.25.4-1.51 1z"/></svg>
          <span>Settings &amp; Backup</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Global Modal -->
  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="card-header">
        <h2 id="modal-title">Modal</h2>
        <button type="button" class="btn btn-ghost btn-sm" id="modal-close-btn">Close</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <script src="./assets/vendor/chart.umd.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
